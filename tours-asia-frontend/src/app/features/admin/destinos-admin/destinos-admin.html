<section class="adm-section">

  <div class="adm-section-header">
    <h2 class="adm-section-title">Destinos</h2>
    <button class="adm-btn-primary" (click)="abrirCrear()" type="button">+ Nuevo destino</button>
  </div>

  @if (formulario()) {
    <div class="adm-form-card">
      <h3 class="adm-form-title">
        {{ modoEdicion() ? 'Editar: ' + modoEdicion()!.name : 'Nuevo destino' }}
      </h3>
      <div class="adm-form-grid">
        <div class="adm-field">
          <label for="dest-name">Nombre *</label>
          <input id="dest-name" type="text" [(ngModel)]="form.name" class="adm-input" required />
        </div>
        <div class="adm-field">
          <label for="dest-country">País *</label>
          <input id="dest-country" type="text" [(ngModel)]="form.country" class="adm-input" required />
        </div>
        <div class="adm-field adm-field-full">
          <label for="dest-desc">Descripción</label>
          <textarea id="dest-desc" [(ngModel)]="form.description" class="adm-input" rows="3"></textarea>
        </div>
        <div class="adm-field adm-field-full">
          <label for="dest-cover">URL de imagen de portada</label>
          <input id="dest-cover" type="url" [(ngModel)]="form.cover_url" class="adm-input" />
        </div>
      </div>
      <div class="adm-form-actions">
        <button class="adm-btn-primary" (click)="guardar()" [disabled]="cargando()" type="button">
          {{ cargando() ? 'Guardando…' : (modoEdicion() ? 'Actualizar' : 'Crear') }}
        </button>
        <button class="adm-btn-secondary" (click)="cancelar()" type="button">Cancelar</button>
      </div>
    </div>
  }

  @if (destinos().length === 0 && !cargando()) {
    <div class="adm-empty"><p>No hay destinos registrados.</p></div>
  } @else {
    <div class="adm-table-wrap">
      <table class="adm-table">
        <thead>
          <tr>
            <th scope="col">Destino</th>
            <th scope="col">País</th>
            <th scope="col">Tours</th>
            <th scope="col">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (d of destinos(); track d.id) {
            <tr>
              <td class="adm-td-name">{{ d.name }}</td>
              <td>{{ d.country }}</td>
              <td>—</td>
              <td>
                <div class="adm-row-actions">
                  <button class="adm-act-btn edit" (click)="abrirEditar(d)" type="button">Editar</button>
                  <button class="adm-act-btn del"  (click)="eliminar(d.id)" type="button">Eliminar</button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }

</section>
