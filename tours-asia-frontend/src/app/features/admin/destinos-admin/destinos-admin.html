<section>
  <!-- HEADER -->
  <div class="dst-header">
    <h2 class="dst-title">Destinos</h2>
    <button class="dst-btn-primary" (click)="abrirCrear()" type="button">+ Nuevo destino</button>
  </div>

  <!-- FORMULARIO -->
  @if (formulario()) {
    <div class="dst-form-card">
      <h3 class="dst-form-title">
        {{ modoEdicion() ? 'Editar: ' + modoEdicion()!.name : 'Nuevo destino' }}
      </h3>
      <div class="dst-form-grid">
        <div class="dst-field">
          <label for="dest-name">Nombre *</label>
          <input id="dest-name" type="text" [(ngModel)]="form.name" class="dst-input" required />
        </div>
        <div class="dst-field">
          <label for="dest-country">País *</label>
          <input
            id="dest-country"
            type="text"
            [(ngModel)]="form.country"
            class="dst-input"
            required
          />
        </div>
        <div class="dst-field dst-field-full">
          <label for="dest-desc">Descripción</label>
          <textarea
            id="dest-desc"
            [(ngModel)]="form.description"
            class="dst-input"
            rows="3"
          ></textarea>
        </div>
        <div class="dst-field dst-field-full">
          <label for="dest-cover">URL de imagen de portada</label>
          <input id="dest-cover" type="url" [(ngModel)]="form.cover_url" class="dst-input" />
        </div>
      </div>
      <div class="dst-form-actions">
        <button class="dst-btn-primary" (click)="guardar()" [disabled]="cargando()" type="button">
          {{ cargando() ? 'Guardando…' : modoEdicion() ? 'Actualizar' : 'Crear' }}
        </button>
        <button class="dst-btn-secondary" (click)="cancelar()" type="button">Cancelar</button>
      </div>
    </div>
  }

  <!-- TABLA -->
  @if (destinos().length === 0 && !cargando()) {
    <div class="dst-empty"><p>No hay destinos registrados.</p></div>
  } @else {
    <div class="dst-table-wrap">
      <table class="dst-table">
        <thead>
          <tr>
            <th scope="col">Destino</th>
            <th scope="col">País</th>
            <th scope="col">Tours</th>
            <th scope="col">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (d of destinos(); track d.id) {
            <tr>
              <td class="dst-td-name">{{ d.name }}</td>
              <td>{{ d.country }}</td>
              <td>—</td>
              <td>
                <div class="dst-row-actions">
                  <button class="dst-act-btn edit" (click)="abrirEditar(d)" type="button">
                    Editar
                  </button>
                  <button class="dst-act-btn del" (click)="eliminar(d.id)" type="button">
                    Eliminar
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</section>
