<app-navbar />

<section class="hero">
  <div class="hero__overlay"></div>
  <div class="hero__content">
    <h1 class="hero__title">Descubre la magia de Asia</h1>
    <p class="hero__subtitle">Experiencias únicas, guías expertos y tours en español</p>
    <button class="hero__btn" routerLink="/tours">Ver todos los tours</button>
  </div>
</section>

<section class="section">
  <div class="container">
    <h2 class="section-title">Destinos populares</h2>
    <div class="grid-3">
      @for (destino of destinosConTours(); track destino.id) {
        <div class="destination-card" (click)="verTours(destino.id)">
          <div class="destination-card__image-wrapper">
            <img [src]="destino.cover_url" [alt]="destino.name" class="destination-card__image" />
            <span class="destination-card__country">{{ destino.country | uppercase }}</span>
          </div>
          <div class="destination-card__body">
            <h3 class="destination-card__name">{{ destino.name }}</h3>
            <p class="destination-card__description">{{ destino.description }}</p>
            <div class="destination-card__footer">
              <span class="destination-card__tours-count">
                <i class="ti ti-map-route" aria-hidden="true"></i> {{ destino.totalTours }} tours
              </span>
              <span class="destination-card__link">
                <i class="ti ti-plane" aria-hidden="true"></i> Ver tours
              </span>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>

<app-footer />
