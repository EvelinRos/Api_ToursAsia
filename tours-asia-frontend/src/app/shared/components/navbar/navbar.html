<nav class="navbar">
  <div class="navbar-inner">
    <a routerLink="/" class="navbar-brand">
      <i class="ti ti-world-longitude" aria-hidden="true"></i>
      Tours Asia
    </a>

    <div class="navbar-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Inicio
      </a>
      <a routerLink="/tours" routerLinkActive="active">Tours</a>

      @if (auth.isLoggedIn()) {
        @if (auth.isAdmin()) {
          <a routerLink="/admin" routerLinkActive="active">
            <i class="ti ti-shield-check" aria-hidden="true"></i> Panel Admin
          </a>
        } @else {
          <a routerLink="/mis-reservas" routerLinkActive="active">
            <i class="ti ti-receipt" aria-hidden="true"></i> Mis reservas
          </a>
        }
        <button class="btn-outline-sm" (click)="auth.logout()">
          <i class="ti ti-logout" aria-hidden="true"></i> Cerrar sesión
        </button>
      } @else {
        <a routerLink="/login" class="btn-outline-sm">
          <i class="ti ti-login-2" aria-hidden="true"></i> Iniciar sesión
        </a>
        <a routerLink="/registro" class="btn-primary-sm">
          <i class="ti ti-user-plus" aria-hidden="true"></i> Registrarse
        </a>
      }
    </div>
  </div>
</nav>
