<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">🌏</div>
    <h1 class="auth-title">Crear cuenta</h1>

    @if (error()) {
      <div class="alert-error">{{ error() }}</div>
    }

    <div class="form-row">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" [(ngModel)]="form.first_name" class="input" placeholder="Tu nombre" />
      </div>
      <div class="form-group">
        <label>Apellido</label>
        <input type="text" [(ngModel)]="form.last_name" class="input" placeholder="Tu apellido" />
      </div>
    </div>

    <div class="form-group">
      <label>Correo electrónico</label>
      <input type="email" [(ngModel)]="form.email" class="input" placeholder="tu@correo.com" />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Teléfono</label>
        <input type="text" [(ngModel)]="form.phone" class="input" placeholder="+57 300..." />
      </div>
      <div class="form-group">
        <label>País</label>
        <input type="text" [(ngModel)]="form.country" class="input" />
      </div>
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" [(ngModel)]="form.password1" class="input" placeholder="••••••••" />
    </div>
    <div class="form-group">
      <label>Confirmar contraseña</label>
      <input type="password" [(ngModel)]="form.password2" class="input" placeholder="••••••••" />
    </div>

    <button class="btn-primary" (click)="submit()" [disabled]="cargando()">
      {{ cargando() ? 'Registrando...' : 'Crear cuenta' }}
    </button>

    <p class="auth-footer">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>
</div>
