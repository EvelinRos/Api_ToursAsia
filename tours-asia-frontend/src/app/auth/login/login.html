<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">🌏</div>
    <h1 class="auth-title">Iniciar sesión</h1>

    @if (error()) {
      <div class="alert-error">{{ error() }}</div>
    }

    <div class="form-group">
      <label>Correo electrónico</label>
      <input type="email" [(ngModel)]="email" placeholder="tu@correo.com" class="input" />
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" [(ngModel)]="password" placeholder="••••••••" class="input" />
    </div>

    <button class="btn-primary" (click)="submit()" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
    </button>

    <p class="auth-footer">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
  </div>
</div>
