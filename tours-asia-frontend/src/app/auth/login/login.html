<div class="auth-page">
  <div class="auth-card">
    <div class="auth-back">
      <a routerLink="/" class="btn-back">
        <i class="ti ti-arrow-left" aria-hidden="true"></i> Volver al inicio
      </a>
    </div>

    <div class="auth-logo">
      <i class="ti ti-world-longitude" aria-hidden="true"></i>
    </div>
    <h1 class="auth-title">Iniciar sesión</h1>

    @if (error()) {
      <div class="alert-error">{{ error() }}</div>
    }

    <div class="form-group">
      <label for="login-email">Correo electrónico</label>
      <input
        id="login-email"
        type="email"
        [(ngModel)]="email"
        placeholder="tu@correo.com"
        class="input"
        autocomplete="email"
      />
    </div>

    <div class="form-group">
      <label for="login-password">Contraseña</label>
      <input
        id="login-password"
        type="password"
        [(ngModel)]="password"
        placeholder="••••••••"
        class="input"
        autocomplete="current-password"
        (keydown.enter)="submit()"
      />
    </div>

    <button class="btn-primary" (click)="submit()" [disabled]="cargando()">
      @if (cargando()) {
        <i class="ti ti-loader-2" aria-hidden="true"></i> Ingresando...
      } @else {
        <i class="ti ti-login-2" aria-hidden="true"></i> Ingresar
      }
    </button>

    <p class="auth-footer">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
  </div>
</div>
