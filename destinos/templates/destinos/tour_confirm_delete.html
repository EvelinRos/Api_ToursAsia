{% extends 'base.html' %}

{% block title %}Eliminar Tour - Tours Asia{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 500px; text-align: center;">
    <div style="color: #ef4444; font-size: 4rem; margin-bottom: 1.5rem;">
        <i class="fas fa-exclamation-triangle"></i>
    </div>
    <h1 style="margin-bottom: 1rem;">¿Estás seguro?</h1>
    <p style="color: #666; margin-bottom: 2rem;">
        Estás a punto de eliminar el tour <strong>{{ object.name }}</strong>. 
        Esta acción es permanente y no se puede deshacer.
    </p>

    <form method="post">
        {% csrf_token %}
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <button type="submit" class="btn btn-danger" style="width: 100%; justify-content: center; padding: 1rem;">
                <i class="fas fa-trash"></i> Sí, eliminar tour
            </button>
            <a href="{% url 'destinos:tour-detail' object.pk %}" class="btn btn-outline" style="width: 100%; justify-content: center; padding: 1rem;">
                No, mantener tour
            </a>
        </div>
    </form>
</div>
{% endblock %}
