{% extends 'destinos/checkout/base_checkout.html' %}

{% block checkout_step %}
<div class="content-section">
    <h2 style="font-size: 1.8rem; margin-bottom: 2rem;">Datos de facturación y contacto</h2>
    
    <form method="post">
        {% csrf_token %}
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div class="form-group">
                <label>Nombre *</label>
                <input type="text" name="first_name" value="{{ checkout.nombre }}" required>
            </div>
            <div class="form-group">
                <label>Apellido *</label>
                <input type="text" name="last_name" value="{{ checkout.apellido }}" required>
            </div>
        </div>

        <div class="form-group">
            <label>Correo electrónico *</label>
            <input type="email" name="email" value="{{ checkout.email }}" required>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.5rem;">
                <i class="fas fa-info-circle"></i> La reserva se asociará a este correo.
            </p>
        </div>

        <div style="display: grid; grid-template-columns: 120px 1fr; gap: 1rem;">
            <div class="form-group">
                <label>Prefijo</label>
                <select name="phone_prefix">
                    <option value="+507">🇵🇦 +507</option>
                    <option value="+57">🇨🇴 +57</option>
                    <option value="+52">🇲🇽 +52</option>
                    <option value="+54">🇦🇷 +54</option>
                    <option value="+56">🇨🇱 +56</option>
                    <option value="+51">🇵🇪 +51</option>
                    <option value="+506">🇨🇷 +506</option>
                    <option value="+593">🇪🇨 +593</option>
                    <option value="+58">🇻🇪 +58</option>
                    <option value="+1">🇺🇸 +1</option>
                </select>
            </div>
            <div class="form-group">
                <label>Teléfono *</label>
                <input type="text" name="phone" value="{{ checkout.telefono }}" required>
            </div>
        </div>

        <div class="form-group">
            <label>País *</label>
            <select name="country" required>
                <option value="Panamá" {% if checkout.pais == 'Panamá' %}selected{% endif %}>Panamá</option>
                <option value="Colombia" {% if checkout.pais == 'Colombia' %}selected{% endif %}>Colombia</option>
                <option value="México" {% if checkout.pais == 'México' %}selected{% endif %}>México</option>
                <option value="Argentina" {% if checkout.pais == 'Argentina' %}selected{% endif %}>Argentina</option>
                <option value="Chile" {% if checkout.pais == 'Chile' %}selected{% endif %}>Chile</option>
                <option value="Otro">Otro</option>
            </select>
        </div>

        <div style="margin-top: 3rem; display: flex; gap: 1.5rem;">
            <a href="{% url 'destinos:checkout-paso1' %}" class="btn btn-outline" style="flex: 1; justify-content: center;">Anterior</a>
            <button type="submit" class="btn" style="flex: 2; justify-content: center; font-size: 1.1rem;">
                Siguiente: Información de pago <i class="fas fa-arrow-right" style="margin-left: 10px;"></i>
            </button>
        </div>
    </form>
</div>
{% endblock %}
