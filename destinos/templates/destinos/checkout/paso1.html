{% extends 'destinos/checkout/base_checkout.html' %}

{% block checkout_step %}
<div class="content-section">
    <h2 style="font-size: 1.8rem; margin-bottom: 2rem;">Detalles de la experiencia</h2>
    
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Selecciona el idioma de la experiencia *</label>
            <select name="language" required>
                <option value="Español" {% if checkout.idioma == 'Español' %}selected{% endif %}>Español</option>
                <option value="English" {% if checkout.idioma == 'English' %}selected{% endif %}>English</option>
                <option value="Português" {% if checkout.idioma == 'Português' %}selected{% endif %}>Português</option>
            </select>
        </div>

        <div style="margin-top: 3rem;">
            <button type="submit" class="btn" style="padding: 1.2rem 3rem; font-size: 1.1rem; width: 100%; justify-content: center;">
                Siguiente: Datos de contacto <i class="fas fa-arrow-right" style="margin-left: 10px;"></i>
            </button>
        </div>
    </form>
</div>
{% endblock %}
