{% extends 'destinos/checkout/base_checkout.html' %}

{% block checkout_step %}
<div class="content-section">
    <h2 style="font-size: 1.8rem; margin-bottom: 1rem;">Información de pago</h2>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">
        <i class="fas fa-lock"></i> Los pagos son seguros y están encriptados
    </p>
    
    <form method="post">
        {% csrf_token %}
        
        <div style="border: 1px solid #eee; border-radius: 12px; margin-bottom: 1.5rem;">
            <div style="padding: 1.5rem; display: flex; align-items: center; gap: 1rem; background: #fafafa; border-radius: 12px 12px 0 0;">
                <input type="radio" name="payment_method" value="tarjeta" checked id="pay_card">
                <label for="pay_card" style="font-weight: 700; margin: 0; flex: 1;">Tarjeta de crédito o débito</label>
                <div style="display: flex; gap: 0.5rem; font-size: 1.5rem; color: #666;">
                    <i class="fab fa-cc-visa"></i>
                    <i class="fab fa-cc-mastercard"></i>
                    <i class="fab fa-cc-amex"></i>
                </div>
            </div>
            
            <div id="card_fields" style="padding: 2rem; border-top: 1px solid #eee;">
                <div class="form-group">
                    <label>Número de tarjeta *</label>
                    <input type="text" name="card_number" placeholder="0000 0000 0000 0000" id="card_num">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="form-group">
                        <label>Expira (MM/AA) *</label>
                        <input type="text" name="expiry" placeholder="MM/AA">
                    </div>
                    <div class="form-group">
                        <label>CVV *</label>
                        <div style="position: relative;">
                            <input type="password" name="cvv" placeholder="123" id="cvv_input">
                            <i class="far fa-eye" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer;" onclick="toggleCVV()"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div style="border: 1px solid #eee; border-radius: 12px; padding: 1.5rem; display: flex; align-items: center; gap: 1rem; margin-bottom: 3rem;">
            <input type="radio" name="payment_method" value="paypal" id="pay_paypal">
            <label for="pay_paypal" style="font-weight: 700; margin: 0; flex: 1;">PayPal</label>
            <i class="fab fa-cc-paypal" style="font-size: 1.5rem; color: #003087;"></i>
        </div>

        <p style="font-size: 0.8rem; color: var(--text-muted); text-align: center; margin-bottom: 2rem;">
            Al presionar "Solicitar reserva" estás aceptando los términos y condiciones y la Política de Privacidad.
        </p>

        <button type="submit" class="btn" style="width: 100%; justify-content: center; padding: 1.5rem; font-size: 1.2rem; background: var(--primary);">
            Solicitar reserva <i class="fas fa-chevron-right" style="margin-left: 10px;"></i>
        </button>
    </form>
</div>

<script>
    function toggleCVV() {
        const input = document.getElementById('cvv_input');
        input.type = input.type === 'password' ? 'text' : 'password';
    }

    // Card number formatting
    document.getElementById('card_num').addEventListener('input', function (e) {
        let value = e.target.value.replace(/\D/g, '').substring(0, 16);
        let formatted = value.match(/.{1,4}/g)?.join(' ') || '';
        e.target.value = formatted;
    });

    // Toggle fields visibility
    document.querySelectorAll('input[name="payment_method"]').forEach(radio => {
        radio.addEventListener('change', function() {
            document.getElementById('card_fields').style.display = this.value === 'tarjeta' ? 'block' : 'none';
        });
    });
</script>
{% endblock %}
