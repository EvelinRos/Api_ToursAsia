{% extends 'base.html' %}

{% block title %}Consulta tus Reservas - Tours Asia{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 500px;">
    <div style="text-align: center; margin-bottom: 2.5rem;">
        <i class="fas fa-search-location fa-3x" style="color: var(--primary); margin-bottom: 1rem;"></i>
        <h1 style="font-size: 2.2rem; margin-bottom: 0.5rem;">Consulta tu reserva</h1>
        <p style="color: var(--text-muted);">Ingresa el correo electrónico que usaste para reservar</p>
    </div>

    <form method="get" action="{% url 'destinos:mis-reservas' %}">
        <div class="form-group">
            <label>Correo electrónico</label>
            <input type="email" name="email" placeholder="tu@email.com" required>
        </div>

        <button type="submit" class="btn" style="width: 100%; justify-content: center; padding: 1.2rem; font-size: 1.1rem; margin-top: 1rem;">
            Ver mis reservas
        </button>
    </form>

    <div style="text-align: center; margin-top: 2.5rem; padding-top: 2rem; border-top: 1px solid #eee;">
        <p style="color: var(--text-muted);">¿Tienes una cuenta? <a href="{% url 'cliente-login' %}" style="color: var(--primary); font-weight: 700; text-decoration: none;">Inicia sesión aquí</a></p>
    </div>
</div>
{% endblock %}
