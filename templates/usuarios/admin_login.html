<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - Tours Asia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'destinos/css/main.css' %}">
    <style>
        body { background-color: var(--dark); color: var(--white); }
        .admin-card { background-color: rgba(255,255,255,0.05); border: 1px solid var(--primary); border-radius: var(--radius); padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 0 30px rgba(255,87,34,0.2); }
        .form-control { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); color: white; }
        .form-control:focus { background: rgba(255,255,255,0.15); }
        .form-control::placeholder { color: rgba(255,255,255,0.5); }
    </style>
</head>
<body style="display:flex; justify-content:center; align-items:center; min-height:100vh;">

    <div class="admin-card">
        <div class="text-center" style="margin-bottom:30px;">
            <i class="fas fa-shield-alt" style="font-size:48px; color:var(--primary); margin-bottom:15px;"></i>
            <h2 style="font-size:24px; color:white; margin:0;">Panel Administrativo</h2>
            <p style="color:var(--gray-500); font-size:14px; margin-top:5px;">Solo para administradores autorizados</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
                <div style="background:rgba(244,67,54,0.2); color:#ffcdd2; padding:15px; border-radius:var(--radius-sm); margin-bottom:20px; border:1px solid var(--danger);">
                    Credenciales inválidas o no tienes permisos.
                </div>
            {% endif %}
            
            <div class="form-group">
                <label style="color:white;">Usuario / Email</label>
                <input type="text" name="username" class="form-control" placeholder="admin@toursasia.com" required>
            </div>
            
            <div class="form-group">
                <label style="color:white;">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            
            <input type="hidden" name="next" value="{{ request.GET.next }}">
            
            <button type="submit" class="btn-primary" style="width:100%; margin-top:20px;">Acceder al Panel</button>
        </form>
    </div>

</body>
</html>
