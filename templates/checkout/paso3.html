{% extends 'checkout/base_checkout.html' %}

{% block checkout_content %}
<h2 style="font-size:28px; margin-bottom:10px;">Selecciona tu método de pago</h2>
<p style="color:var(--gray-500); margin-bottom:30px;">Todas las transacciones son seguras y están encriptadas.</p>

<div class="card" style="padding:30px; margin-bottom:30px;">
    <form method="post" action="{% url 'checkout-paso3' %}" id="checkoutForm" onsubmit="return validatePaso3(event)">
        {% csrf_token %}
        
        <div style="border:1px solid var(--primary); border-radius:var(--radius-sm); margin-bottom:20px; overflow:hidden;">
            <div style="background:var(--primary-light); padding:15px 20px; display:flex; align-items:center; gap:15px; border-bottom:1px solid var(--gray-200);">
                <input type="radio" name="payment_method" value="tarjeta" id="pmTarjeta" checked onchange="handlePaymentMethodChange()" style="width:18px; height:18px;">
                <label for="pmTarjeta" style="margin:0; font-weight:600; flex:1; cursor:pointer;">Tarjeta de crédito o débito</label>
                <div style="display:flex; gap:5px; font-size:24px; color:var(--dark);">
                    <i class="fab fa-cc-visa"></i>
                    <i class="fab fa-cc-mastercard"></i>
                    <i class="fab fa-cc-amex"></i>
                </div>
            </div>
            <div id="cardDetails" style="padding:20px; background:var(--white);">
                <div class="form-group">
                    <label>Número de tarjeta</label>
                    <div style="position:relative;">
                        <input type="text" id="cardNumber" class="form-control" placeholder="0000 0000 0000 0000" maxlength="19" oninput="formatCardNumber(this)" required>
                        <i class="far fa-credit-card" style="position:absolute; right:15px; top:15px; color:var(--gray-500);"></i>
                    </div>
                </div>
                
                <div class="grid-2">
                    <div class="form-group">
                        <label>Fecha de expiración</label>
                        <input type="text" class="form-control" placeholder="MM/AA" maxlength="5" required>
                    </div>
                    <div class="form-group">
                        <label>Código de seguridad (CVV)</label>
                        <div style="position:relative;">
                            <input type="password" id="cardCvv" class="form-control" placeholder="123" maxlength="4" required>
                            <i class="far fa-eye" style="position:absolute; right:15px; top:15px; color:var(--gray-500); cursor:pointer;" onclick="toggleCVV()"></i>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Nombre en la tarjeta</label>
                    <input type="text" class="form-control" placeholder="Como aparece en la tarjeta" required>
                </div>
            </div>
        </div>
        
        <div style="border:1px solid var(--gray-200); border-radius:var(--radius-sm); margin-bottom:30px; overflow:hidden;">
            <div style="padding:15px 20px; display:flex; align-items:center; gap:15px;">
                <input type="radio" name="payment_method" value="paypal" id="pmPaypal" onchange="handlePaymentMethodChange()" style="width:18px; height:18px;">
                <label for="pmPaypal" style="margin:0; font-weight:600; flex:1; cursor:pointer;">PayPal</label>
                <div style="font-size:24px; color:#003087;">
                    <i class="fab fa-paypal"></i>
                </div>
            </div>
            <div id="paypalDetails" style="padding:20px; background:var(--gray-100); display:none; text-align:center;">
                <p style="color:var(--gray-500); margin-bottom:15px;">Serás redirigido a PayPal para completar tu compra de forma segura.</p>
            </div>
        </div>
        
        <div style="margin-top:40px; display:flex; justify-content:space-between; align-items:center;">
            <a href="{% url 'checkout-paso2' %}" style="color:var(--gray-500);"><i class="fas fa-arrow-left"></i> Volver</a>
            <button type="submit" class="btn-primary" style="padding:15px 40px; font-size:18px; background:var(--success);">Confirmar y Pagar</button>
        </div>
        <div style="text-align:right; margin-top:15px; color:var(--gray-500); font-size:12px;">
            <i class="fas fa-lock"></i> Pago seguro verificado
        </div>
    </form>
</div>
{% endblock %}
